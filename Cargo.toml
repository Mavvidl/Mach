[package]
name = "mach"
version = "0.1.0"
edition = "2021"
description = "Outil CLI type `file` augmenté : type, processus liés, usage et références."
license = "MIT"

[[bin]]
name = "mach"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
infer = "0.16"
sysinfo = "0.32"
walkdir = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

[profile.release]
opt-level = 3
lto = true
